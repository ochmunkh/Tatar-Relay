plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'mn.tatar'
version = '0.2.0'

repositories {
    mavenCentral()
}

dependencies {
    // Burp provides the Montoya API at runtime — compile against it only.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    // Bundled into the fat jar (Burp does not provide it).
    implementation 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

shadowJar {
    archiveBaseName.set('tatar-relay-burp')
    archiveClassifier.set('')
    archiveVersion.set('')
}

// `gradle build` produces build/libs/tatar-relay-burp.jar
tasks.named('build') { dependsOn 'shadowJar' }
