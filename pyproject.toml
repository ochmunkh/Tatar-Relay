[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tatar-relay"
version = "0.1.0"
description = "Application-Layer Protocol Adaptation Layer — turn encrypted APIs into editable HTTP for security testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Enkhbat.O" }]
keywords = ["security", "pentest", "burp", "mitmproxy", "decrypt", "proxy", "http", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "cryptography>=41.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mitmproxy = ["mitmproxy>=10.0"]

[project.scripts]
relay = "tatar_relay.cli:main"

[project.urls]
Homepage = "https://github.com/EnkhbatO/tatar-relay"

[tool.setuptools.packages.find]
include = ["tatar_relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
