name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write        # publish the GitHub release
  id-token: write        # keyless signing for build provenance
  attestations: write    # store the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build Burp extension jar
        run: bash .github/build-jar.sh

      # CycloneDX SBOM of exactly what a user installs: the package and its
      # runtime dependencies, resolved in a clean venv (no build/audit tools).
      - name: SBOM (CycloneDX)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          mkdir -p dist
          python -m venv sbomenv
          sbomenv/bin/pip install --quiet .
          pip install --quiet "cyclonedx-bom==9.0.0"
          cyclonedx-py environment --output-format JSON \
            -o "dist/tatar-relay-${VER}.sbom.cdx.json" sbomenv/bin/python

      - name: Assemble release assets (jar + source tarball + checksums)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp burp/build/libs/tatar-relay-burp.jar "dist/tatar-relay-burp-${VER}.jar"
          # source tarball from tracked files only (no local/gitignored profiles)
          git archive --format=tar.gz --prefix="tatar-relay-${VER}/" -o "dist/tatar-relay-${VER}.tar.gz" HEAD
          cd dist
          sha256sum "tatar-relay-burp-${VER}.jar" "tatar-relay-${VER}.tar.gz" \
                    "tatar-relay-${VER}.sbom.cdx.json" > SHA256SUMS
          echo "----- SHA256SUMS -----"; cat SHA256SUMS

      # SLSA build provenance, signed keylessly via Sigstore and verifiable with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/tatar-relay-burp-*.jar
            dist/tatar-relay-*.tar.gz
            dist/tatar-relay-*.sbom.cdx.json

      - name: Publish release with assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/tatar-relay-burp-*.jar
            dist/tatar-relay-*.tar.gz
            dist/tatar-relay-*.sbom.cdx.json
            dist/SHA256SUMS
          generate_release_notes: true
